<!DOCTYPE html>
<html>

    <head>
        <title>Paint - Guy Shitrit</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div id="topBar">
            <button onclick="clearCanvas()">Clear</button>

            <div id="sizeControl">
                <span>Size</span>
                <input type="range" min="5" max="20" value="10" oninput="resizeCanvas(this.value)">
                <span id="sizeLabel">10</span>
            </div>
        </div>

        <div id="workspace">
            <div id="palette">
                <div class="colors" style="background:#000000" onclick="pickPaint('#000000')"></div>
                <div class="colors" style="background:#FFFFFF" onclick="pickPaint('#FFFFFF')"></div>
                <div class="colors" style="background:#FF0000" onclick="pickPaint('#FF0000')"></div>
                <div class="colors" style="background:#00FF00" onclick="pickPaint('#00FF00')"></div>
                <div class="colors" style="background:#0000FF" onclick="pickPaint('#0000FF')"></div>
                <input id="colorPicker" type="color" onchange="pickPaint(this.value)">
            </div>

            <div id="canvas"></div>
        </div>

        <marquee id="marquee" scrollamount="30px;">Made by Guy Shitrit</marquee>

    </body>

    <script src="script.js"></script>

</html>
